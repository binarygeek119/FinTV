<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect to ChannelFlow</title>
  <base href="/">
  <script>window.__CF_BASE__="";</script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="css/legacy-admin.css">
  <link rel="stylesheet" href="css/app.css?v=assets8">
</head>
<body>
  <div class="auth-screen">
    <form id="pair-form" class="auth-card">
      <img src="logo.png" alt="ChannelFlow" class="auth-logo">
      <h1>Connect</h1>
      <p>Enter the quick pin from ChannelFlow. You get M3U and XMLTV links with access already on them.</p>
      <label class="field">
        <span>Quick pin</span>
        <input id="pair-pin" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required>
      </label>
      <p id="pair-error" class="auth-error"></p>
      <button type="submit" class="raised button-submit">Connect</button>
      <div id="pair-result" class="hidden">
        <label class="field">
          <span>M3U tuner URL</span>
          <input id="pair-m3u" type="text" class="emby-input" readonly>
        </label>
        <label class="field">
          <span>XMLTV guide URL</span>
          <input id="pair-xmltv" type="text" class="emby-input" readonly>
        </label>
        <div class="actions">
          <button type="button" id="pair-copy-m3u" class="emby-button">Copy M3U</button>
          <button type="button" id="pair-copy-xmltv" class="emby-button">Copy XMLTV</button>
        </div>
      </div>
    </form>
  </div>
  <script>
    const base = window.__CF_BASE__ || '';
    const form = document.getElementById('pair-form');
    const error = document.getElementById('pair-error');
    const result = document.getElementById('pair-result');

    function copy(id, label) {
      const text = document.getElementById(id).value || '';
      navigator.clipboard.writeText(text).catch(() => window.prompt('Copy URL:', text));
    }

    document.getElementById('pair-copy-m3u').addEventListener('click', () => copy('pair-m3u', 'M3U'));
    document.getElementById('pair-copy-xmltv').addEventListener('click', () => copy('pair-xmltv', 'XMLTV'));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      result.classList.add('hidden');
      const pin = document.getElementById('pair-pin').value || '';
      try {
        const res = await fetch(base + '/api/setup/pair', {
          method: 'POST',
          headers: { accept: 'application/json', 'content-type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.message || 'Could not connect.');
        }
        document.getElementById('pair-m3u').value = data.m3u || '';
        document.getElementById('pair-xmltv').value = data.epg || '';
        result.classList.remove('hidden');
      } catch (err) {
        error.textContent = err.message || 'Could not connect.';
      }
    });
  </script>
</body>
</html>
