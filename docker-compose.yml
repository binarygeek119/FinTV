services:
  channelflow:
    image: ghcr.io/flowmeadow01/channelflow:latest
    container_name: ChannelFlow
    build: .
    ports:
      - "${CHANNELFLOW_PORT:-${FINTV_PORT:-8097}}:8097"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-fintv}
      POSTGRES_USER: ${POSTGRES_USER:-fintv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintv}
      CHANNELFLOW_CONFIG: /config
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      TZ: ${TZ:-America/Chicago}
      FFMPEG_PATH: ${FFMPEG_PATH:-/usr/bin/ffmpeg}
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL:-vaapi}
      FFMPEG_VAAPI_DEVICE: ${FFMPEG_VAAPI_DEVICE:-/dev/dri/renderD128}
      CHANNELFLOW_PUBLIC_URL: ${CHANNELFLOW_PUBLIC_URL:-${FINTV_PUBLIC_URL:-}}
      CHANNELFLOW_PATH_BASE: ${CHANNELFLOW_PATH_BASE:-${FINTV_PATH_BASE:-}}
      CHANNELFLOW_IMAGE: ${CHANNELFLOW_IMAGE:-ghcr.io/flowmeadow01/channelflow:latest}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - channelflow-config:/config
      - ${CHANNELFLOW_MEDIA:-${FINTV_MEDIA:-./media}}:/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8097/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  channelflow-config:
